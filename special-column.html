    /* ── RESET & LAYOUT ── */
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard',sans-serif;background:#111;color:#fff;overflow-x:hidden}
    .container{display:flex}

    .mv_container{width:100%;height:90vh;position:relative}
    .swiper-container,.swiper-wrapper,.swiper-slide{width:100%;height:100%}
    .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 6s ease;filter:brightness(0.5)}
    .swiper-slide-active .bg{transform:scale(1.12)}
    .bg1{background-image:url('./img/intro-1.jpg')}
    .bg2{background-image:url('./img/intro-2.jpg')}

    .mv_txt_box{position:absolute;top:20%;left:5%;max-width:640px;z-index:2}

    .mv_tit{font-size:43px;line-height:1.4;margin:0 0 12px}
    @media screen and (max-width:620px){ .mv_tit{font-size:34px !important;} }
    @media screen and (max-width:500px){ .mv_tit{font-size:26px !important;} }
    .mv_txt{font-size:18px;line-height:1.6;font-weight:300}
    .mv_btn{
      display:inline-block;margin-top:30px;padding:14px 36px;
      border:2px solid #fff;border-radius:40px;
      background:transparent;color:#fff;font-weight:600;letter-spacing:.3px;
      opacity:0;pointer-events:none;
      transition:opacity .6s,background .35s,box-shadow .35s,color .35s,transform .35s;
      position:relative;overflow:hidden;text-decoration:none;
    }
    .swiper-slide-active .mv_btn{opacity:1;pointer-events:auto}
    .mv_btn::after{
      content:'';position:absolute;inset:0;background:rgba(255,255,255,.15);
      transform:translateX(-100%);transition:transform .4s;
    }
    .mv_btn:hover::after{transform:translateX(0)}
    .mv_btn:hover{
      background:#fff;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.25);
      transform:translateY(-2px);
    }

    /* ── WAVE ANIMATION ── */
    .wave_anim .wave{display:inline-block;opacity:0;animation:wave 1.1s ease-out forwards}
    @keyframes wave{0%{transform:translateY(25px);opacity:0}100%{transform:translateY(0);opacity:1}}
    .wave_anim.custom .wave:nth-child(1){animation-delay:.15s}
    .wave_anim.custom .wave:nth-child(2){animation-delay:.3s}
    .wave_anim.custom .wave:nth-child(3){animation-delay:.45s}

    /* ── PROGRESS BAR ── */
    .progress-container{position:absolute;bottom:80px;left:5%;right:5%;height:4px;display:flex;gap:10px;z-index:3;width:150px;}
    .progress-segment{flex:1;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;cursor:pointer}
    .progress-fill{width:0;height:100%;background:#fff;display:block}

    .wheel_down{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:24px;opacity:.7;z-index:3;animation: wheel-bounce 2s ease-in-out infinite;}

    @keyframes wheel-fade {
      0%{opacity:1;transform:translateY(0)}
      80%{opacity:.2;transform:translateY(10px)}

<script>
  document.addEventListener('DOMContentLoaded',()=>{
    const titleBox   = document.querySelector('.sub-visual__title');
    const breadcrumb = document.querySelector('.breadcrumb-nav');
    const visual     = document.querySelector('.sub-visual__wrap.visual-01');

    visual.classList.add('play');

    const dur = parseInt(getComputedStyle(visual).getPropertyValue('--reveal-dur')) || 900;

    setTimeout(()=>{
      titleBox.classList.add('in');
      breadcrumb.classList.add('in');
      alignBreadcrumb();
    }, dur + 40);

    window.addEventListener('scroll',()=>{
      const scrolled=window.scrollY||window.pageYOffset;
      if(visual){
        visual.style.backgroundPosition=`center ${Math.max(0,-scrolled*0.15)}px`;
      }
    });

    function alignBreadcrumb(){
      const areaRect = document.querySelector('.sub-visual__area').getBoundingClientRect();
      const wrapRect = visual.getBoundingClientRect();
      const nav      = breadcrumb;
      const gap      = 12;
      nav.style.bottom = (wrapRect.bottom - areaRect.top + gap * -1) + 'px';
    }
    window.addEventListener('resize',alignBreadcrumb);
  });
</script>

    #h-service-banners .h-banner-wrapper{

  <script>
    (function() {
      var root = document.getElementById('h-service-banners');
      if(!root) return;
 
      var STEP = 12; /* ✅ 처음 노출 개수 = 클릭당 추가 노출 개수 */
 
      var filterBtns = root.querySelectorAll('.h-filter-btn');
      var cards = Array.prototype.slice.call(root.querySelectorAll('.h-banner'));
      var moreBtn = root.querySelector('#h-load-more-btn');
 
      var currentFilter = 'all';
      var shown = STEP;
 
      function matches(card){
        return currentFilter === 'all' || card.getAttribute('data-category') === currentFilter;
      }
 
      function render(){
        var matchedCount = 0;
        cards.forEach(function(card){
          if(matches(card)){
            card.style.display = (matchedCount < shown) ? '' : 'none';
            matchedCount++;
          } else {
            card.style.display = 'none';
          }
        });
        if(moreBtn){ moreBtn.hidden = !(matchedCount > shown); }
      }
 
      filterBtns.forEach(function(btn){
        btn.addEventListener('click', function(){
          filterBtns.forEach(function(x){
            x.classList.remove('is-active');
            x.setAttribute('aria-selected','false');
          });
          btn.classList.add('is-active');
          btn.setAttribute('aria-selected','true');
 
          currentFilter = btn.getAttribute('data-filter');
          shown = STEP;        /* 필터 바꾸면 다시 처음부터 */
          render();
        });
      });
 
      if(moreBtn){
        moreBtn.addEventListener('click', function(){
          shown += STEP;       /* 클릭할 때마다 STEP개씩 더 노출 */
          render();
        });
      }
 
      render();
    })();
  </script>
