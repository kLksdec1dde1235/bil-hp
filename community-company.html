  <style>
    /* ── RESET & LAYOUT ── */
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard',sans-serif;background:#111;color:#fff;overflow-x:hidden}
    .container{display:flex}
    #main{flex:1;position:relative;overflow:hidden}
    #visualTransWrap{position:absolute;inset:0;pointer-events:none;z-index:5}

    /* ── SWIPER & BG ── */
    .mv_container{width:100%;height:90vh;position:relative}
    .swiper-container,.swiper-wrapper,.swiper-slide{width:100%;height:100%}
    .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 6s ease;filter:brightness(0.5)}
    .swiper-slide-active .bg{transform:scale(1.12)}
    .bg1{background-image:url('./img/intro-1.jpg')}
    .bg2{background-image:url('./img/intro-2.jpg')}
    .bg3{background-image:url('./img/page-3.jpg')}
    .bg4{background-image:url('./img/repair.jpg')}

    /* ── TEXT & BUTTON ── */
    .mv_txt_box{position:absolute;top:20%;left:5%;max-width:640px;z-index:2}
    .mv_cate{font-size:18px;font-weight:600;margin-bottom:14px;color:#ffeb55;display:inline-block}
    .mv_tit{font-size:43px;line-height:1.4;margin:0 0 12px}
    @media screen and (max-width:620px){ .mv_tit{font-size:34px !important;} }
    @media screen and (max-width:500px){ .mv_tit{font-size:26px !important;} }
    .mv_txt{font-size:18px;line-height:1.6;font-weight:300}
    .mv_btn{
      display:inline-block;margin-top:30px;padding:14px 36px;
      border:2px solid #fff;border-radius:40px;
      background:transparent;color:#fff;font-weight:600;letter-spacing:.3px;
      opacity:0;pointer-events:none;
      transition:opacity .6s,background .35s,box-shadow .35s,color .35s,transform .35s;
      position:relative;overflow:hidden;text-decoration:none;
    }
    .swiper-slide-active .mv_btn{opacity:1;pointer-events:auto}
    .mv_btn::after{
      content:'';position:absolute;inset:0;background:rgba(255,255,255,.15);
      transform:translateX(-100%);transition:transform .4s;
    }
    .mv_btn:hover::after{transform:translateX(0)}
    .mv_btn:hover{
      background:#fff;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.25);
      transform:translateY(-2px);
    }

    /* ── WAVE ANIMATION ── */
    .wave_anim .wave{display:inline-block;opacity:0;animation:wave 1.1s ease-out forwards}
    @keyframes wave{0%{transform:translateY(25px);opacity:0}100%{transform:translateY(0);opacity:1}}
    .wave_anim.custom .wave:nth-child(1){animation-delay:.15s}
    .wave_anim.custom .wave:nth-child(2){animation-delay:.3s}
    .wave_anim.custom .wave:nth-child(3){animation-delay:.45s}

    /* ── PROGRESS BAR ── */
    .progress-container{position:absolute;bottom:80px;left:5%;right:5%;height:4px;display:flex;gap:10px;z-index:3;width:150px;}
    .progress-segment{flex:1;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;cursor:pointer}
    .progress-fill{width:0;height:100%;background:#fff;display:block}

    .wheel_down{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:24px;opacity:.7;z-index:3;animation: wheel-bounce 2s ease-in-out infinite;}
    .wheel_down .wheel {animation: wheel-fade 2s ease-in-out infinite;}
    @keyframes wheel-fade {
      0%{opacity:1;transform:translateY(0)}
      80%{opacity:.2;transform:translateY(10px)}
      100%{opacity:0;transform:translateY(14px)}
    }
    #sidebar{display:none}
  </style>

  <style>
    /* ──────────────────────────────────────────
          #visual-section 전용 스타일
      ─────────────────────────────────────────── */
    #visual-section{position:relative;width:100%;height:100vh;overflow:hidden}
    #visual-section .video_wrap{position:absolute;inset:0;z-index:0}
    #visual-section .video_wrap video{width:100%;height:100%;object-fit:cover;object-position:center}
    #visual-section .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
    #visual-section .txt_container{
      position:absolute;inset:0;z-index:2;
      display:flex;flex-direction:column;
      justify-content:space-evenly;align-items:center;
      text-align:center;pointer-events:none
    }
    @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    #visual-section .company,#visual-section .logo,#visual-section .exp{opacity:0}
    #visual-section.animate .company{
      color:#fff;font-size:2.5rem;font-weight:500;margin-bottom:.5em;
      animation:fadeInUp 1s ease-out forwards;animation-delay:.2s
    }
    #visual-section.animate .logo{animation:fadeInUp 1s ease-out forwards;animation-delay:.7s}
    #visual-section .logo .m_logo{
      width:800px;height:130px;
      background:url("../img/sm-logo.png") no-repeat center/contain;
      margin-bottom:.5em
    }
    #visual-section.animate .exp{
      color:#fff;font-size:1.25rem;line-height:1.6;max-width:80%;
      animation:fadeInUp 1s ease-out forwards;animation-delay:1s
    }
    #visual-section .highlight{color:#e6d3a3;font-weight:600}
    @media (max-width:768px){
      #visual-section .company{font-size:2rem !important}

        background:url("../img/sm-font.png") no-repeat center/contain;
        width:400px;height:300px
      }
      #visual-section .exp{font-size:1rem}
      #visual-section .video_wrap video{object-position:right center}
    }
  </style>

<style>
#nhnHeroSlider{
  position:relative;
  width:100%;
  height:90vh;
  min-height:600px;
  overflow:hidden;
  font-family:'Pretendard','Noto Sans KR',sans-serif;

  --nhn-side-left: clamp(40px, 6vw, 120px);
  --nhn-side-right: 40px;
  --nhn-ui-width: 190px;
  --nhn-progress-bottom: 63px;
}

/* 슬라이드 래퍼 */
#nhnHeroSlider .nhn-slider{
  display:flex;
  height:100%;
  transition:transform 1s cubic-bezier(.77,0,.18,1);
}

/* 각 슬라이드 */
#nhnHeroSlider .nhn-slide{
  min-width:100%;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  padding:0 var(--nhn-side-left);
  box-sizing:border-box;
  overflow:hidden;
}

/* 배경 */
#nhnHeroSlider .nhn-bg{
  position:absolute;
  inset:0;
  z-index:0;
}

#nhnHeroSlider .nhn-bg::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  background:
    linear-gradient(90deg, rgba(0,0,0,.48) 0%, rgba(0,0,0,.28) 36%, rgba(0,0,0,.18) 62%, rgba(0,0,0,.30) 100%),
    linear-gradient(180deg, rgba(0,0,0,.14) 0%, rgba(0,0,0,.10) 30%, rgba(0,0,0,.26) 100%);
  pointer-events:none;
}

#nhnHeroSlider .nhn-bg img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.52);
  transform:scale(1.05);
  transition:transform 6s ease, filter .6s ease;
}

#nhnHeroSlider .nhn-slide.active .nhn-bg img{
  transform:scale(1.12);
  filter:brightness(.48);
}

/* 텍스트 */
#nhnHeroSlider .nhn-content{
  position:relative;
  z-index:2;
  max-width:700px;
}

#nhnHeroSlider .nhn-title{
  font-size:clamp(19px,3vw,32px);
  font-weight:300;
  color:#fff;
  margin-bottom:14px;
  opacity:0;
  transform:translateY(30px);
  text-shadow:0 2px 14px rgba(0,0,0,.28);
}

#nhnHeroSlider .nhn-brand{
  font-size:clamp(36px,4vw,60px);
  font-weight:700;
  color:#5da5ff;
  margin-bottom:20px;
  opacity:0;
  transform:translateY(30px);
  text-shadow:0 3px 18px rgba(0,0,0,.22);
}

#nhnHeroSlider .nhn-desc{
  font-size:clamp(14px,1.2vw,18px);
  color:rgba(255,255,255,.92);
  line-height:1.7;
  opacity:0;
  transform:translateY(30px);
  text-shadow:0 2px 12px rgba(0,0,0,.26);
}

/* 활성화 애니메이션 */
#nhnHeroSlider .nhn-slide.active .nhn-title{
  animation:nhnFadeUp .8s forwards;
}
#nhnHeroSlider .nhn-slide.active .nhn-brand{
  animation:nhnFadeUp .8s .2s forwards;
}
#nhnHeroSlider .nhn-slide.active .nhn-desc{
  animation:nhnFadeUp .8s .4s forwards;
}

@keyframes nhnFadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* 하단 프로그레스 */
#nhnHeroSlider .nhn-progress{
  position:absolute;
  bottom:var(--nhn-progress-bottom);
  left:var(--nhn-side-left);
  right:calc(var(--nhn-side-right) + var(--nhn-ui-width));
  height:2px;
  background:rgba(255,255,255,.24);
  z-index:2;
  pointer-events:none;
}

#nhnHeroSlider .nhn-progress-bar{
  height:100%;
  width:0%;
  background:#fff;
}

/* 오른쪽 UI */
#nhnHeroSlider .nhn-ui{
  position:absolute;
  bottom:40px;
  right:var(--nhn-side-right);
  display:flex;
  align-items:center;
  gap:20px;
  color:#fff;
  z-index:3;
  min-width:var(--nhn-ui-width);
  justify-content:flex-end;
}

#nhnHeroSlider .nhn-page{
  font-size:14px;
  opacity:.85;
  letter-spacing:.04em;
  white-space:nowrap;
}

/* 버튼 */
#nhnHeroSlider .nhn-btn{
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.3s;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  user-select:none;
}
#nhnHeroSlider .nhn-btn:hover{
  background:#fff;
  color:#000;
}

/* 모바일 */
@media(max-width:768px){
  #nhnHeroSlider{
    --nhn-side-left: 24px;
    --nhn-side-right: 24px;
    --nhn-ui-width: 136px;
    --nhn-progress-bottom: 86px;
  }

  #nhnHeroSlider .nhn-slide{
    padding:0 24px;
    align-items:flex-end;
    padding-bottom:140px;
  }

  #nhnHeroSlider .nhn-content{
    max-width:100%;
  }

  #nhnHeroSlider .nhn-ui{
    bottom:24px;
    gap:12px;
  }

  #nhnHeroSlider .nhn-btn{
    width:42px;
    height:42px;
  }

  #nhnHeroSlider .nhn-page{
    font-size:13px;
  }
}
</style>

<style>
/* ══════════════════════════════════════════════════════════
   #partnerDirectory — 모든 스타일은 이 ID 아래에서만 작동

#partnerDirectory{

<div id="pdContent"></div>

<script>
(function(){
  'use strict';

  var root = document.getElementById('partnerDirectory');
  if(!root) return;
  root.setAttribute('data-view','card');

  /* ═══════════ DOM 생성 ═══════════ */
  var navTabs = document.getElementById('pdNavTabs');
  var content = document.getElementById('pdContent');

  data.forEach(function(cat, ci){
    /* NAV TAB */
    var tab = document.createElement('button');
    tab.className = 'pd-nav-tab';
    tab.setAttribute('data-active', ci === 0 ? 'true' : 'false');
    tab.setAttribute('data-target', cat.id);
    tab.textContent = cat.category;
    tab.type = 'button';
    navTabs.appendChild(tab);

    /* SECTION */
    var sec = document.createElement('div');
    sec.className = 'pd-cat';
    sec.id = cat.id;
    sec.setAttribute('data-hidden','false');
    var sliderId = 'pdSlider_' + ci;

    /* HEADER */
    var hd = document.createElement('div');
    hd.className = 'pd-cat-header';
    hd.innerHTML =
      '<h2 class="pd-cat-title">' + cat.category + '</h2>' +
      '<div class="pd-arrows">' +
        '<button type="button" class="pd-arrow" data-dir="prev" data-slider="' + sliderId + '" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>' +
        '<button type="button" class="pd-arrow" data-dir="next" data-slider="' + sliderId + '" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>' +
      '</div>';
    sec.appendChild(hd);

    /* CARD SLIDER */
    var sw = document.createElement('div');
    sw.className = 'pd-slider-wrap';
    var sl = document.createElement('div');
    sl.className = 'pd-slider';
    sl.id = sliderId;

    cat.companies.forEach(function(c){
      var cd = document.createElement('article');
      cd.className = 'pd-card';
      cd.setAttribute('data-name', c.name.toLowerCase());
      cd.setAttribute('data-tags', c.tags.join(' ').toLowerCase());
      cd.setAttribute('data-hidden','false');
      cd.innerHTML =
        '<div class="pd-card-thumb">' +
          '<img src="' + c.image + '" alt="' + c.name + '" loading="lazy">' +
          '<div class="pd-card-overlay">' +
            '<div class="pd-card-ov-title">' + c.overlay.replace(/\n/g,'<br>') + '</div>' +
            '<div class="pd-card-ov-role">' + c.name + ' ' + c.role + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="pd-card-meta">' +
          '<span class="pd-card-meta-cat" style="color:' + cat.accent + '">' + cat.category + '</span>' +
          '<span class="pd-card-meta-sep"></span>' +
          '<span class="pd-card-meta-desc">' + c.desc + '</span>' +
        '</div>' +
        '<div class="pd-card-name">' + c.name + ' | ' + c.role + '</div>' +
        '<div class="pd-card-tags">' + c.tags.map(function(t){return '<span class="pd-tag">'+t+'</span>'}).join('') + '</div>';
      sl.appendChild(cd);
    });
    sw.appendChild(sl);
    sec.appendChild(sw);

    /* LIST VIEW */
    var lw = document.createElement('div');
    lw.className = 'pd-list-wrap';

    cat.companies.forEach(function(c, idx){
      var item = document.createElement('div');
      item.className = 'pd-list-item';
      item.setAttribute('data-name', c.name.toLowerCase());
      item.setAttribute('data-tags', c.tags.join(' ').toLowerCase());
      item.setAttribute('data-hidden','false');
      item.innerHTML =
        '<span class="pd-list-num">' + String(idx+1).padStart(2,'0') + '</span>' +
        '<span class="pd-list-logo">' + c.logo + '</span>' +
        '<div class="pd-list-info">' +
          '<div class="pd-list-name">' + c.name + '</div>' +
          '<div class="pd-list-role">' + c.role + '</div>' +
        '</div>' +
        '<div class="pd-list-desc">' + c.desc + '</div>' +
        '<div class="pd-list-tags">' + c.tags.map(function(t){return '<span class="pd-list-tag">'+t+'</span>'}).join('') + '</div>';
      lw.appendChild(item);
    });
    sec.appendChild(lw);

    /* NO RESULT */
    var nr = document.createElement('div');
    nr.className = 'pd-no-result';
    nr.textContent = '검색 결과가 없습니다.';
    sec.appendChild(nr);

    content.appendChild(sec);
  });

  /* ═══════════ 카테고리 탭 드래그 스크롤 ═══════════ */
  (function(){
    var el = navTabs;
    var isDown = false;
    var startX = 0;
    var scrollLeft = 0;
    var hasMoved = false;

    el.addEventListener('mousedown', function(e){
      isDown = true;
      hasMoved = false;
      el.classList.add('dragging');
      startX = e.pageX - el.offsetLeft;
      scrollLeft = el.scrollLeft;
      e.preventDefault();
    });

    el.addEventListener('mouseleave', function(){
      isDown = false;
      el.classList.remove('dragging');
    });

    el.addEventListener('mouseup', function(){
      isDown = false;
      el.classList.remove('dragging');
    });

    el.addEventListener('mousemove', function(e){
      if(!isDown) return;
      var x = e.pageX - el.offsetLeft;
      var walk = (x - startX) * 1.5;
      if(Math.abs(walk) > 4) hasMoved = true;
      el.scrollLeft = scrollLeft - walk;
    });

    /* 드래그 후 클릭 방지 */
    el.addEventListener('click', function(e){
      if(hasMoved){
        e.stopPropagation();
        e.preventDefault();
        hasMoved = false;
      }
    }, true);
  })();

  /* ═══════════ INTERACTIONS ═══════════ */
  var allTabs = root.querySelectorAll('.pd-nav-tab');
  var catBlocks = root.querySelectorAll('.pd-cat');
  var pdNav = document.getElementById('pdNav');
  var ticking = false;
  var currentActive = -1;
  var isClickScrolling = false;

  /* 스크롤 → 활성 탭 */
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      pdNav.classList.toggle('scrolled', window.scrollY > 10);
      if(!isClickScrolling){
        var navH = pdNav.offsetHeight;
        var newActive = 0;
        for(var i = 0; i < catBlocks.length; i++){
          if(catBlocks[i].getAttribute('data-hidden') !== 'true' && catBlocks[i].getBoundingClientRect().top <= navH + 60) newActive = i;
        }
        if(newActive !== currentActive){
          currentActive = newActive;
          allTabs.forEach(function(n, j){n.setAttribute('data-active', j === currentActive ? 'true' : 'false')});
          /* 탭 영역 안에서 활성 탭이 보이도록 */
          var activeTab = allTabs[currentActive];
          var tabsEl = navTabs;
          var tabLeft = activeTab.offsetLeft;
          var tabWidth = activeTab.offsetWidth;
          var scrollL = tabsEl.scrollLeft;
          var visibleW = tabsEl.clientWidth;
          if(tabLeft < scrollL){
            tabsEl.scrollTo({left:tabLeft - 16, behavior:'smooth'});
          } else if(tabLeft + tabWidth > scrollL + visibleW){
            tabsEl.scrollTo({left:tabLeft + tabWidth - visibleW + 16, behavior:'smooth'});
          }
        }
      }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, {passive:true});

  /* 탭 클릭 */
  allTabs.forEach(function(tab){
    tab.addEventListener('click', function(e){
      var target = document.getElementById(tab.getAttribute('data-target'));
      if(!target) return;
      allTabs.forEach(function(n){n.setAttribute('data-active','false')});
      tab.setAttribute('data-active','true');
      isClickScrolling = true;
      target.scrollIntoView({behavior:'smooth'});
      setTimeout(function(){ isClickScrolling = false; }, 800);
    });
  });

  /* 뷰 토글 */
  var viewBtns = root.querySelectorAll('.pd-view-btn');
  viewBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      var mode = btn.getAttribute('data-view');
      root.setAttribute('data-view', mode);
      viewBtns.forEach(function(b){b.setAttribute('data-active', b.getAttribute('data-view') === mode ? 'true' : 'false')});
    });
  });

  /* 카드 슬라이더 화살표 */
  root.querySelectorAll('.pd-arrow').forEach(function(btn){
    btn.addEventListener('click', function(){
      var slider = document.getElementById(btn.getAttribute('data-slider'));
      if(!slider) return;
      var card = slider.querySelector('.pd-card');
      var amt = card ? card.offsetWidth + 24 : 400;
      slider.scrollBy({left: btn.getAttribute('data-dir') === 'prev' ? -amt : amt, behavior:'smooth'});
    });
  });

  /* 카드 슬라이더 드래그 */
  root.querySelectorAll('.pd-slider').forEach(function(sl){
    var down=false, sx, sLeft;
    sl.addEventListener('mousedown', function(e){down=true;sl.style.cursor='grabbing';sx=e.pageX-sl.offsetLeft;sLeft=sl.scrollLeft});
    sl.addEventListener('mouseleave', function(){down=false;sl.style.cursor=''});
    sl.addEventListener('mouseup', function(){down=false;sl.style.cursor=''});
    sl.addEventListener('mousemove', function(e){if(!down)return;e.preventDefault();sl.scrollLeft=sLeft-((e.pageX-sl.offsetLeft)-sx)*1.2});
  });

  /* ═══════════ SEARCH (추가) ═══════════ */
  var searchInput = document.getElementById('pdSearchInput');
  var searchClear = document.getElementById('pdSearchClear');
  var searchCount = document.getElementById('pdSearchCount');
  var emptyState = document.getElementById('pdEmptyState');
  var emptyKeyword = document.getElementById('pdEmptyKeyword');

  function doSearch(){
    var q = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle('visible', q.length > 0);
    var totalMatch = 0;

    catBlocks.forEach(function(sec){
      var cards = sec.querySelectorAll('.pd-card');
      var listItems = sec.querySelectorAll('.pd-list-item');
      var catMatch = 0;

      cards.forEach(function(c){
        if(q.length === 0){ c.setAttribute('data-hidden','false'); catMatch++; return; }
        var n = c.getAttribute('data-name'), t = c.getAttribute('data-tags');
        var match = n.indexOf(q) !== -1 || t.indexOf(q) !== -1;
        c.setAttribute('data-hidden', match ? 'false' : 'true');
        if(match) catMatch++;
      });

      listItems.forEach(function(l){
        if(q.length === 0){ l.setAttribute('data-hidden','false'); return; }
        var n = l.getAttribute('data-name'), t = l.getAttribute('data-tags');
        var match = n.indexOf(q) !== -1 || t.indexOf(q) !== -1;
        l.setAttribute('data-hidden', match ? 'false' : 'true');
      });

      totalMatch += catMatch;
      sec.setAttribute('data-hidden', catMatch === 0 && q.length > 0 ? 'true' : 'false');
      var nr = sec.querySelector('.pd-no-result');
      if(nr){ catMatch === 0 && q.length > 0 ? nr.classList.add('visible') : nr.classList.remove('visible'); }
    });

    if(q.length > 0){
      searchCount.textContent = '"' + searchInput.value.trim() + '" 검색 결과 ' + totalMatch + '개';
      if(totalMatch === 0){
        emptyKeyword.textContent = searchInput.value.trim();
        emptyState.classList.add('visible');
      } else {
        emptyState.classList.remove('visible');
      }
    } else {
      searchCount.textContent = '';
      emptyState.classList.remove('visible');
    }
  }

  searchInput.addEventListener('input', function(){
    searchClear.classList.toggle('visible', searchInput.value.trim().length > 0);
  });
  searchInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); doSearch(); }
  });
  document.getElementById('pdSearchSubmit').addEventListener('click', doSearch);
  searchClear.addEventListener('click', function(){ searchInput.value = ''; doSearch(); searchInput.focus(); });

  /* 추천 키워드 클릭 */
  root.querySelectorAll('.pd-empty-tip').forEach(function(tip){
    tip.addEventListener('click', function(){
      searchInput.value = tip.getAttribute('data-q');
      doSearch();
    });
  });

  requestAnimationFrame(onScroll);
})();
</script>
</section>
