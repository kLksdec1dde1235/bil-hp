  <style>
    /* ── RESET & LAYOUT ── */
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard',sans-serif;background:#111;color:#fff;overflow-x:hidden}
    .container{display:flex}
    #main{flex:1;position:relative;overflow:hidden}
    #visualTransWrap{position:absolute;inset:0;pointer-events:none;z-index:5}

    /* ── SWIPER & BG ── */
    .mv_container{width:100%;height:90vh;position:relative}
    .swiper-container,.swiper-wrapper,.swiper-slide{width:100%;height:100%}
    .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 6s ease;filter:brightness(0.5)}
    .swiper-slide-active .bg{transform:scale(1.12)}
    .bg1{background-image:url('./img/intro-1.jpg')}
    .bg2{background-image:url('./img/intro-2.jpg')}
    .bg3{background-image:url('./img/page-3.jpg')}
    .bg4{background-image:url('./img/repair.jpg')}

    /* ── TEXT & BUTTON ── */
    .mv_txt_box{position:absolute;top:20%;left:5%;max-width:640px;z-index:2}
    .mv_cate{font-size:18px;font-weight:600;margin-bottom:14px;color:#ffeb55;display:inline-block}
    .mv_tit{font-size:43px;line-height:1.4;margin:0 0 12px}
    @media screen and (max-width:620px){ .mv_tit{font-size:34px !important;} }
    @media screen and (max-width:500px){ .mv_tit{font-size:26px !important;} }
    .mv_txt{font-size:18px;line-height:1.6;font-weight:300}
    .mv_btn{
      display:inline-block;margin-top:30px;padding:14px 36px;
      border:2px solid #fff;border-radius:40px;
      background:transparent;color:#fff;font-weight:600;letter-spacing:.3px;
      opacity:0;pointer-events:none;
      transition:opacity .6s,background .35s,box-shadow .35s,color .35s,transform .35s;
      position:relative;overflow:hidden;text-decoration:none;
    }
    .swiper-slide-active .mv_btn{opacity:1;pointer-events:auto}
    .mv_btn::after{
      content:'';position:absolute;inset:0;background:rgba(255,255,255,.15);
      transform:translateX(-100%);transition:transform .4s;
    }
    .mv_btn:hover::after{transform:translateX(0)}
    .mv_btn:hover{
      background:#fff;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.25);
      transform:translateY(-2px);
    }

    /* ── WAVE ANIMATION ── */
    .wave_anim .wave{display:inline-block;opacity:0;animation:wave 1.1s ease-out forwards}
    @keyframes wave{0%{transform:translateY(25px);opacity:0}100%{transform:translateY(0);opacity:1}}
    .wave_anim.custom .wave:nth-child(1){animation-delay:.15s}
    .wave_anim.custom .wave:nth-child(2){animation-delay:.3s}
    .wave_anim.custom .wave:nth-child(3){animation-delay:.45s}

    /* ── PROGRESS BAR ── */
    .progress-container{position:absolute;bottom:80px;left:5%;right:5%;height:4px;display:flex;gap:10px;z-index:3;width:150px;}
    .progress-segment{flex:1;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;cursor:pointer}
    .progress-fill{width:0;height:100%;background:#fff;display:block}

    .wheel_down{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:24px;opacity:.7;z-index:3;animation: wheel-bounce 2s ease-in-out infinite;}
    .wheel_down .wheel {animation: wheel-fade 2s ease-in-out infinite;}
    @keyframes wheel-fade {
      0%{opacity:1;transform:translateY(0)}
      80%{opacity:.2;transform:translateY(10px)}
      100%{opacity:0;transform:translateY(14px)}
    }
    #sidebar{display:none}
  </style>

  <style>
    /* ──────────────────────────────────────────

      ─────────────────────────────────────────── */
    #visual-section{position:relative;width:100%;height:100vh;overflow:hidden}
    #visual-section .video_wrap{position:absolute;inset:0;z-index:0}
    #visual-section .video_wrap video{width:100%;height:100%;object-fit:cover;object-position:center}
    #visual-section .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5)}

      position:absolute;inset:0;z-index:2;
      display:flex;flex-direction:column;
      justify-content:space-evenly;align-items:center;

    }
    @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    #visual-section .company,#visual-section .logo,#visual-section .exp{opacity:0}
    #visual-section.animate .company{
      color:#fff;font-size:2.5rem;font-weight:500;margin-bottom:.5em;

<style>
#nhnHeroSlider{
  position:relative;
  width:100%;
  height:90vh;
  min-height:600px;
  overflow:hidden;
  font-family:'Pretendard','Noto Sans KR',sans-serif;

  --nhn-side-left: clamp(40px, 6vw, 120px);
  --nhn-side-right: 40px;
  --nhn-ui-width: 190px;
  --nhn-progress-bottom: 63px;
}

/* 슬라이드 래퍼 */
#nhnHeroSlider .nhn-slider{
  display:flex;
  height:100%;
  transition:transform 1s cubic-bezier(.77,0,.18,1);
}

/* 각 슬라이드 */
#nhnHeroSlider .nhn-slide{
  min-width:100%;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  padding:0 var(--nhn-side-left);
  box-sizing:border-box;
  overflow:hidden;
}

/* 배경 */
#nhnHeroSlider .nhn-bg{
  position:absolute;
  inset:0;
  z-index:0;
}

#nhnHeroSlider .nhn-bg::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  background:
    linear-gradient(90deg, rgba(0,0,0,.48) 0%, rgba(0,0,0,.28) 36%, rgba(0,0,0,.18) 62%, rgba(0,0,0,.30) 100%),
    linear-gradient(180deg, rgba(0,0,0,.14) 0%, rgba(0,0,0,.10) 30%, rgba(0,0,0,.26) 100%);
  pointer-events:none;
}

#nhnHeroSlider .nhn-bg img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.9);
  transform:scale(1.05);
  transition:transform 6s ease, filter .6s ease;
}

#nhnHeroSlider .nhn-slide.active .nhn-bg img{
  transform:scale(1.12);
  filter:brightness(.48);
}

/* 텍스트 */
#nhnHeroSlider .nhn-content{
  position:relative;
  z-index:2;
  max-width:700px;
}

#nhnHeroSlider .nhn-title{
  font-size:clamp(19px,3vw,32px);
  font-weight:300;
  color:#fff;
  margin-bottom:14px;
  opacity:0;
  transform:translateY(30px);
  text-shadow:0 2px 14px rgba(0,0,0,.28);
}

#nhnHeroSlider .nhn-brand{
  font-size:clamp(36px,4vw,60px);
  font-weight:700;
  color:#5da5ff;
  margin-bottom:20px;
  opacity:0;
  transform:translateY(30px);
  text-shadow:0 3px 18px rgba(0,0,0,.22);
}

#nhnHeroSlider .nhn-desc{
  font-size:clamp(14px,1.2vw,18px);
  color:rgba(255,255,255,.92);
  line-height:1.7;
  opacity:0;
  transform:translateY(30px);
  text-shadow:0 2px 12px rgba(0,0,0,.26);
}

/* 활성화 애니메이션 */
#nhnHeroSlider .nhn-slide.active .nhn-title{
  animation:nhnFadeUp .8s forwards;
}
#nhnHeroSlider .nhn-slide.active .nhn-brand{
  animation:nhnFadeUp .8s .2s forwards;
}
#nhnHeroSlider .nhn-slide.active .nhn-desc{
  animation:nhnFadeUp .8s .4s forwards;
}

@keyframes nhnFadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* 하단 프로그레스 */
#nhnHeroSlider .nhn-progress{
  position:absolute;
  bottom:var(--nhn-progress-bottom);
  left:var(--nhn-side-left);
  right:calc(var(--nhn-side-right) + var(--nhn-ui-width));
  height:2px;
  background:rgba(255,255,255,.24);
  z-index:2;
  pointer-events:none;
}

#nhnHeroSlider .nhn-progress-bar{
  height:100%;
  width:0%;
  background:#fff;
}

/* 오른쪽 UI */
#nhnHeroSlider .nhn-ui{
  position:absolute;
  bottom:40px;
  right:var(--nhn-side-right);
  display:flex;
  align-items:center;
  gap:20px;
  color:#fff;
  z-index:3;
  min-width:var(--nhn-ui-width);
  justify-content:flex-end;
}

#nhnHeroSlider .nhn-page{
  font-size:14px;
  opacity:.85;
  letter-spacing:.04em;
  white-space:nowrap;
}

/* 버튼 */
#nhnHeroSlider .nhn-btn{
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.3s;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  user-select:none;
}
#nhnHeroSlider .nhn-btn:hover{
  background:#fff;
  color:#000;
}

/* 모바일 */
@media(max-width:768px){
  #nhnHeroSlider{
    --nhn-side-left: 24px;
    --nhn-side-right: 24px;
    --nhn-ui-width: 136px;
    --nhn-progress-bottom: 86px;
  }

  #nhnHeroSlider .nhn-slide{
    padding:0 24px;
    align-items:flex-end;
    padding-bottom:140px;
  }

  #nhnHeroSlider .nhn-content{
    max-width:100%;
  }

  #nhnHeroSlider .nhn-ui{
    bottom:24px;
    gap:12px;
  }

  #nhnHeroSlider .nhn-btn{
    width:42px;
    height:42px;
  }

  #nhnHeroSlider .nhn-page{
    font-size:13px;
  }
}
</style>

#partnerDirectory .pd-search-icon svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#partnerDirectory .pd-search input{
  flex:1;
  border:none;
  background:none;
  outline:none;
  font-size:14px;
  font-family:inherit;
  color:#1a1a1a;
  padding:13px 14px 13px 0;
  min-width:0;
}
#partnerDirectory .pd-search input::placeholder{color:#bbb}
#partnerDirectory .pd-search-clear{
  padding:0 12px;
  display:none;
  align-items:center;
  cursor:pointer;
  color:#ccc;
  transition:color .2s;
  flex-shrink:0;
  border:none;
  background:none;
  font-family:inherit;
  outline:none;
}
#partnerDirectory .pd-search-clear.visible{display:flex}
#partnerDirectory .pd-search-clear:hover{color:#888}
#partnerDirectory .pd-search-clear svg{
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#partnerDirectory .pd-search-submit{
  flex-shrink:0;
  width:44px;
  height:44px;
  border-radius:12px;
  border:none;
  background:#1a1a1a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .2s ease, transform .15s ease, box-shadow .2s ease;
  outline:none;
  padding:0;
}
#partnerDirectory .pd-search-submit:hover{
  background:#333;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  transform:translateY(-1px);
}
#partnerDirectory .pd-search-submit:active{
  transform:scale(.96);
  box-shadow:none;
}
#partnerDirectory .pd-search-submit svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#partnerDirectory .pd-search-count{
  font-size:13px;
  color:#bbb;
  margin-top:10px;
  min-height:20px;
}
#partnerDirectory .pd-no-result{
  text-align:center;
  padding:40px 20px;
  color:#ccc;
  font-size:14px;
  display:none;
}
#partnerDirectory .pd-no-result.visible{display:block}

/* 전체 검색 결과 없음 (글로벌) */
#partnerDirectory .pd-empty-state{
  display:none;
  text-align:center;
  padding:100px 24px 120px;
  max-width:480px;
  margin:0 auto;
}
#partnerDirectory .pd-empty-state.visible{display:block}
#partnerDirectory .pd-empty-icon{
  width:80px;
  height:80px;
  margin:0 auto 28px;
  border-radius:50%;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
}
#partnerDirectory .pd-empty-icon svg{
  width:36px;
  height:36px;
  fill:none;
  stroke:#ccc;
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#partnerDirectory .pd-empty-title{
  font-size:22px;
  font-weight:800;
  color:#1a1a1a;
  margin-bottom:10px;
  letter-spacing:-.02em;
}
#partnerDirectory .pd-empty-keyword{
  color:#e67e22;
}
#partnerDirectory .pd-empty-desc{
  font-size:14px;
  color:#999;
  line-height:1.7;
  margin-bottom:28px;
}
#partnerDirectory .pd-empty-tips{
  display:inline-flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}
#partnerDirectory .pd-empty-tip{
  font-size:12px;
  font-weight:500;
  color:#888;
  background:#f7f7f7;
  border:1px solid #eee;
  border-radius:100px;
  padding:6px 14px;
  cursor:pointer;
  transition:all .2s ease;
}
#partnerDirectory .pd-empty-tip:hover{
  background:#eee;
  color:#555;
}

/* ── CATEGORY BLOCK ── */
#partnerDirectory .pd-cat{
  padding:72px 0 48px;
  border-bottom:1px solid #eee;
  scroll-margin-top:56px;
}
#partnerDirectory .pd-cat:last-child{
  border-bottom:none;
  padding-bottom:80px;
}
#partnerDirectory .pd-cat[data-hidden="true"]{
  display:none;
}

#partnerDirectory .pd-cat-header{
  max-width:1320px;
  margin:0 auto;
  padding:0 48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:32px;
}
#partnerDirectory .pd-cat-title{
  font-size:clamp(26px,3.2vw,38px);
  font-weight:900;
  letter-spacing:-.03em;
  color:#1a1a1a;
  line-height:1.2;
}

/* 슬라이드 화살표 */
#partnerDirectory .pd-arrows{
  display:flex;
  gap:8px;
}
#partnerDirectory[data-view="list"] .pd-arrows{
  display:none;
}
#partnerDirectory .pd-arrow{
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid #d0d0d0;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .25s ease;
  color:#888;
  flex-shrink:0;
  padding:0;
  outline:none;
  font-family:inherit;
}
#partnerDirectory .pd-arrow:hover{
  border-color:#1a1a1a;
  color:#1a1a1a;
}
#partnerDirectory .pd-arrow:active{
  transform:scale(.95);
}
#partnerDirectory .pd-arrow svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ══════════════════════════════════
   CARD VIEW (가로 슬라이더)
   ══════════════════════════════════ */
#partnerDirectory .pd-slider-wrap{
  max-width:1320px;
  margin:0 auto;
  padding:0 48px;
}
#partnerDirectory[data-view="list"] .pd-slider-wrap{
  display:none;
}

#partnerDirectory .pd-slider{
  display:flex;
  gap:24px;
  overflow-x:auto;
  scroll-behavior:smooth;
  scrollbar-width:none;
  scroll-snap-type:x mandatory;
  padding-bottom:8px;
  cursor:grab;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}
#partnerDirectory .pd-slider::-webkit-scrollbar{display:none}
#partnerDirectory .pd-slider.dragging{
  cursor:grabbing;
  scroll-behavior:auto;
  scroll-snap-type:none;
}
#partnerDirectory .pd-slider.dragging .pd-card{
  pointer-events:none;
}
#partnerDirectory .pd-card,
#partnerDirectory .pd-card *,
#partnerDirectory .pd-list-item,
#partnerDirectory .pd-list-item *{
  -webkit-user-select:none;
  user-select:none;
}
#partnerDirectory .pd-card img,
#partnerDirectory .pd-list-item img{
  -webkit-user-drag:none;
  user-drag:none;
}

#partnerDirectory .pd-card{
  flex:0 0 auto;
  width:380px;
  cursor:pointer;
  scroll-snap-align:start;
  transition:transform .3s ease;
}
#partnerDirectory .pd-card:hover{
  transform:translateY(-3px);
}
#partnerDirectory .pd-card[data-hidden="true"]{
  display:none;
}

#partnerDirectory .pd-card-thumb{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  border-radius:6px;
  overflow:hidden;
  background:#f0f0f0;
}
#partnerDirectory .pd-card-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .5s ease;
}
#partnerDirectory .pd-card:hover .pd-card-thumb img{
  transform:scale(1.04);
}

#partnerDirectory .pd-card-overlay{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:24px 22px 20px;
  background:linear-gradient(0deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.12) 70%,transparent 100%);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
}
#partnerDirectory .pd-card-ov-title{
  font-size:clamp(14px,1.4vw,18px);
  font-weight:700;
  color:#fff;
  line-height:1.45;
  text-shadow:0 1px 6px rgba(0,0,0,.3);
  flex:1;
}
#partnerDirectory .pd-card-ov-role{
  font-size:12px;
  font-weight:500;
  color:rgba(255,255,255,.8);
  white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.3);
  display:none;
}

#partnerDirectory .pd-card-meta{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:14px;
  flex-wrap: wrap;
}
#partnerDirectory .pd-card-meta-cat{
  font-size:13px;
  font-weight:600;
  letter-spacing:-.01em;
}
#partnerDirectory .pd-card-meta-sep{
  width:1px;
  height:12px;
  background:#d0d0d0;
  display:block;
}
#partnerDirectory .pd-card-meta-desc{
  font-size:13px;
  font-weight:400;
  color:#888;
}
#partnerDirectory .pd-card-name{
  font-size:clamp(15px,1.2vw,17px);
  font-weight:700;
  color:#1a1a1a;
  margin-top:10px;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
#partnerDirectory .pd-card-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}
#partnerDirectory .pd-tag{
  font-size:12px;
  font-weight:400;
  color:#666;
  background:#f5f5f5;
  border:1px solid #eee;
  border-radius:3px;
  padding:4px 10px;
  line-height:1;
}

/* ══════════════════════════════════
   LIST VIEW (보완)
   ══════════════════════════════════ */
#partnerDirectory .pd-list-wrap{
  max-width:1320px;
  margin:0 auto;
  padding:0 48px;
  display:none;
}
#partnerDirectory[data-view="list"] .pd-list-wrap{
  display:block;
}

/* 리스트 카드 형태 */
#partnerDirectory .pd-list-item{
  display:flex;
  align-items:center;
  gap:20px;
  padding:20px 24px;
  border:1px solid #f0f0f0;
  border-radius:10px;
  margin-bottom:12px;
  transition:all .25s ease;
  cursor:pointer;
  background:#fff;
}
#partnerDirectory .pd-list-item:hover{
  border-color:#ddd;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
  transform:translateY(-1px);
}
#partnerDirectory .pd-list-item:last-child{
  margin-bottom:0;
}
#partnerDirectory .pd-list-item[data-hidden="true"]{
  display:none;
}

#partnerDirectory .pd-list-num{
  font-size:14px;
  font-weight:700;
  color:#ccc;
  min-width:28px;
  text-align:center;
  flex-shrink:0;
}

#partnerDirectory .pd-list-logo{
  width:48px;
  height:48px;
  border-radius:10px;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:800;
  color:#888;
  flex-shrink:0;
  border:1px solid #eee;
}

#partnerDirectory .pd-list-info{
  flex:1;
  min-width:0;
}
#partnerDirectory .pd-list-name{
  font-size:16px;
  font-weight:700;
  color:#1a1a1a;
  margin-bottom:3px;
  line-height:1.3;
}
#partnerDirectory .pd-list-role{
  font-size:13px;
  font-weight:500;
  color:#999;
}

#partnerDirectory .pd-list-desc{
  flex:1.5;
  min-width:0;
  font-size:13px;
  font-weight:400;
  color:#777;
  line-height:1.6;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

#partnerDirectory .pd-list-tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  flex-shrink:0;
  max-width:220px;
}
#partnerDirectory .pd-list-tag{
  font-size:11px;
  font-weight:500;
  color:#888;
  background:#f7f7f7;
  border:1px solid #eee;
  border-radius:100px;
  padding:4px 10px;
  line-height:1;
  white-space:nowrap;
}

/* ══════════════════════════════════

   ══════════════════════════════════ */

  }

/* ══════════════════════════════════════════════════════════
   비즈니스혁신연구소 톤 레이어 — 화이트 · #114ca5 · 잉크 · 라인
   (기존 #partnerDirectory 스타일 위에 덮어쓰기)
   ══════════════════════════════════════════════════════════ */
#partnerDirectory{
  --ink:#111111;--sub:#4a4f57;--mute:#8a9099;--line:#e6e8ec;--soft:#f5f7fa;--point:#114ca5;
  --pad:clamp(20px,4.4vw,64px);
  font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#fff;color:var(--ink);
}

/* ── INTRO ── */
#partnerDirectory .pd-intro{max-width:1280px;margin:0 auto;padding:clamp(80px,10vw,150px) var(--pad) clamp(48px,5vw,72px)}
#partnerDirectory .pd-intro-label{display:flex;align-items:center;gap:14px;font-size:clamp(13px,1.05vw,15px);font-weight:700;letter-spacing:.08em;color:var(--point);margin-bottom:clamp(20px,2.4vw,32px)}
#partnerDirectory .pd-intro-label::before{content:"";width:32px;height:2px;background:var(--point)}
#partnerDirectory .pd-intro-title{font-size:clamp(28px,3.6vw,52px);font-weight:700;line-height:1.3;letter-spacing:-.045em;word-break:keep-all}
#partnerDirectory .pd-intro-title b{color:var(--point);font-weight:700}
#partnerDirectory .pd-intro-desc{margin-top:clamp(20px,2.4vw,32px);max-width:720px;font-size:clamp(16px,1.3vw,19px);line-height:1.85;color:var(--sub);word-break:keep-all}
#partnerDirectory .pd-intro-steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(48px,6vw,88px);background:#fff;border:1px solid var(--line);list-style:none}
#partnerDirectory .pd-intro-steps li{position:relative;padding:clamp(22px,2.4vw,32px) clamp(18px,2vw,28px)}
#partnerDirectory .pd-intro-steps li+li{border-left:1px solid var(--line)}
#partnerDirectory .pd-intro-steps small{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--point);margin-bottom:10px}
#partnerDirectory .pd-intro-steps strong{font-size:clamp(17px,1.5vw,21px);font-weight:700;letter-spacing:-.035em;word-break:keep-all}
#partnerDirectory .pd-intro-steps li:last-child{background:var(--point);color:#fff}
#partnerDirectory .pd-intro-steps li:last-child small{color:rgba(255,255,255,.7)}

/* ── NAV / SEARCH ── */
#partnerDirectory .pd-nav{background:rgba(255,255,255,.96);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#partnerDirectory .pd-nav.scrolled{box-shadow:0 8px 24px -16px rgba(17,20,28,.2)}
#partnerDirectory .pd-nav-inner{max-width:1280px;padding:0 var(--pad)}
#partnerDirectory .pd-nav-inner,#partnerDirectory .pd-nav-tabs,#partnerDirectory .pd-nav-tab{height:60px}
#partnerDirectory .pd-nav-tab{padding:0 18px;font-size:15px;font-weight:600;color:var(--mute);letter-spacing:-.02em}
#partnerDirectory .pd-nav-tab:first-child{padding-left:0}
#partnerDirectory .pd-nav-tab:first-child::after{left:0}
#partnerDirectory .pd-nav-tab::after{height:2px;background:var(--point);left:18px;right:18px}
#partnerDirectory .pd-nav-tab[data-active="true"]{color:var(--ink);font-weight:700}
#partnerDirectory .pd-nav-tab:hover{color:var(--ink)}
#partnerDirectory .pd-view-btn{border-radius:0;border-color:var(--line);background:#fff;color:var(--mute)}
#partnerDirectory .pd-view-btn:hover{border-color:var(--ink);color:var(--ink)}
#partnerDirectory .pd-view-btn[data-active="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

#partnerDirectory .pd-search-bar{max-width:1280px;padding:32px var(--pad) 0}
#partnerDirectory .pd-search{max-width:600px;gap:0}
#partnerDirectory .pd-search-field{background:var(--soft);border:1px solid var(--line);border-right:0;border-radius:0}
#partnerDirectory .pd-search-field:focus-within{border-color:var(--point);box-shadow:none;background:#fff}
#partnerDirectory .pd-search input{font-size:15px;padding:15px 14px 15px 0}
#partnerDirectory .pd-search input::placeholder{color:var(--mute)}
#partnerDirectory .pd-search-submit{border-radius:0;width:54px;height:52px;background:var(--point)}
#partnerDirectory .pd-search-submit:hover{background:var(--ink);box-shadow:none;transform:none}
#partnerDirectory .pd-search-count{color:var(--mute)}
#partnerDirectory .pd-empty-icon{border-radius:0;background:var(--soft)}
#partnerDirectory .pd-empty-keyword{color:var(--point)}
#partnerDirectory .pd-empty-tip{border-radius:0;background:#fff;border-color:var(--line);color:var(--sub)}
#partnerDirectory .pd-empty-tip:hover{background:var(--point);border-color:var(--point);color:#fff}

/* ── CATEGORY ── */
#partnerDirectory .pd-cat{padding:clamp(72px,8vw,120px) 0 clamp(48px,5vw,80px);border-bottom:0;scroll-margin-top:60px}
#partnerDirectory .pd-cat:nth-child(even){background:var(--soft)}
#partnerDirectory .pd-cat-header,#partnerDirectory .pd-slider-wrap,#partnerDirectory .pd-list-wrap{max-width:1280px;padding-left:var(--pad);padding-right:var(--pad)}
#partnerDirectory .pd-cat-header{align-items:flex-end;margin-bottom:clamp(28px,3vw,44px);gap:24px}
#partnerDirectory .pd-cat-no{display:flex;align-items:center;gap:14px;font-size:clamp(13px,1.05vw,15px);font-weight:700;letter-spacing:.08em;color:var(--point);margin-bottom:clamp(14px,1.6vw,22px)}
#partnerDirectory .pd-cat-no::before{content:"";width:32px;height:2px;background:var(--point)}
#partnerDirectory .pd-cat-title{font-size:clamp(26px,3vw,44px);font-weight:700;letter-spacing:-.045em;line-height:1.25}
#partnerDirectory .pd-cat-title small{font-size:14px;font-weight:600;color:var(--mute);margin-left:12px;letter-spacing:0;vertical-align:middle}
#partnerDirectory .pd-cat-desc{margin-top:14px;max-width:680px;font-size:clamp(15px,1.25vw,17.5px);line-height:1.8;color:var(--sub);word-break:keep-all}
#partnerDirectory .pd-arrows{gap:0}
#partnerDirectory .pd-arrow{width:50px;height:50px;border-radius:0;border-color:var(--line);background:#fff;color:var(--ink)}
#partnerDirectory .pd-arrow+.pd-arrow{border-left:0}
#partnerDirectory .pd-arrow:hover{background:var(--ink);border-color:var(--ink);color:#fff}

/* ── CARD ── */
#partnerDirectory .pd-slider{gap:24px}
#partnerDirectory .pd-card{width:368px;background:#fff;border:1px solid var(--line);transition:border-color .3s}

        var tags = arr(c.tags), ints = arr(c.interests);
        var biz = (c.business && typeof c.business === 'object') ? c.business : { summary:c.business };
        var q = [c.name, c.role, c.desc, tags.join(' '), ints.join(' '), biz.summary, arr(biz.items).join(' ')].join(' ').toLowerCase();
        var intLine = ints.slice(0,2).join(' · ');

        var cd = document.createElement('article');
        cd.className = 'pd-card';
        cd.setAttribute('data-id', c.id);
        cd.setAttribute('data-q', q);
        cd.setAttribute('data-hidden','false');
        cd.setAttribute('role','button');
        cd.setAttribute('tabindex','0');
        cd.setAttribute('aria-label', c.name + ' 상세 보기');
        cd.innerHTML =
          '<div class="pd-card-thumb">' + thumb(c.image, c.name, acc, c.logo) +
            '<span class="pd-card-no">' + String(idx+1).padStart(2,'0') + '</span>' +
            '<div class="pd-card-overlay">' +
              '<div class="pd-card-ov-title">' + nl(c.overlay) + '</div>' +
              '<span class="pd-card-ov-more">자세히 보기</span>' +
            '</div>' +
          '</div>' +
          '<div class="pd-card-meta">' +
            '<span class="pd-card-meta-cat" style="color:' + esc(acc) + '">' + esc(cat.category) + '</span>' +
            '<span class="pd-card-meta-sep"></span>' +
            '<span class="pd-card-meta-desc">' + esc(c.desc) + '</span>' +
          '</div>' +
          '<div class="pd-card-name">' + esc(c.name) + (c.role ? ' | ' + esc(c.role) : '') + '</div>' +
          (intLine ? '<div class="pd-card-interest"><b style="color:' + esc(acc) + '">관심</b>' + esc(intLine) + '</div>' : '') +
          '<div class="pd-card-tags">' + tags.map(function(t){ return '<span class="pd-tag">' + esc(t) + '</span>'; }).join('') + '</div>';
        sl.appendChild(cd);

        var item = document.createElement('div');
        item.className = 'pd-list-item';
        item.setAttribute('data-id', c.id);
        item.setAttribute('data-q', q);
        item.setAttribute('data-hidden','false');
        item.setAttribute('role','button');
        item.setAttribute('tabindex','0');
        item.innerHTML =
          '<span class="pd-list-num">' + String(idx+1).padStart(2,'0') + '</span>' +
          '<span class="pd-list-logo">' + esc(c.logo || String(c.name).charAt(0)) + '</span>' +
          '<div class="pd-list-info">' +
            '<div class="pd-list-name">' + esc(c.name) + '</div>' +
            '<div class="pd-list-role">' + esc(c.role) + '</div>' +
            (intLine ? '<div class="pd-list-int">관심 · ' + esc(intLine) + '</div>' : '') +
          '</div>' +
          '<div class="pd-list-desc">' + esc(biz.summary || c.desc) + '</div>' +
          '<div class="pd-list-tags">' + tags.map(function(t){ return '<span class="pd-list-tag">' + esc(t) + '</span>'; }).join('') + '</div>';
        lw.appendChild(item);
      });

      sw.appendChild(sl);
      sec.appendChild(sw);
      sec.appendChild(lw);
      var nr = document.createElement('div');
      nr.className = 'pd-no-result';
      nr.textContent = '검색 결과가 없습니다.';
      sec.appendChild(nr);
      content.appendChild(sec);
      bindSliderDrag(sl);
    });

    catBlocks = Array.prototype.slice.call(root.querySelectorAll('.pd-cat'));
    allTabs = Array.prototype.slice.call(root.querySelectorAll('.pd-nav-tab'));
    buildTips();
    currentActive = -1;
    requestAnimationFrame(onScroll);
    openFromHash();
  }

  /* ═══════════ 상세 패널 ═══════════ */
  function sec(no, anchor, en, title, inner){
    return '<section class="pd-d-sec" id="pdD-' + anchor + '">' +
      '<header class="pd-d-sec-h"><span class="pd-d-label">' + no + '&nbsp;&nbsp;' + en + '</span><h3>' + title + '</h3></header>' +
      '<div class="pd-d-sec-c">' + inner + '</div></section>';
  }

  function openDetail(id, keepFocus){
    var e = INDEX[id];
    if(!e) return;
    var c = e.c, cat = e.cat, acc = POINT;
    var total = arr(cat.companies).length;
    var biz = (c.business && typeof c.business === 'object') ? c.business : { summary:c.business };
    var items = arr(biz.items), strengths = arr(c.strengths), ints = arr(c.interests), pf = arr(c.portfolio);

    detail.style.setProperty('--acc', acc);
    dCrumb.innerHTML = '<b>' + esc(cat.category) + '</b><i></i>생각 1% 파트너 <span>' + String(e.idx + 1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0') + '</span>';
    detail.querySelectorAll('[data-move]').forEach(function(b){ b.style.display = total > 1 ? '' : 'none'; });

    var html = '';
    html += '<div class="pd-d-cover">' + thumb(c.image, c.name, acc, c.logo) +
      '<div class="pd-d-cover-txt"><span class="pd-d-cat">' + esc(cat.category) + ' 분야의 생각 1%</span>' +
      '<div class="pd-d-name" id="pdDetailName">' + esc(c.name) + '</div>' +
      (c.role ? '<div class="pd-d-role">' + esc(c.role) + (c.desc ? ' · ' + esc(c.desc) : '') + '</div>' : '') +
      '</div></div>';

    html += '<div class="pd-d-head">' +
      (c.overlay ? '<p class="pd-d-catch">' + nl(c.overlay) + '</p>' : '') +
      (arr(c.tags).length ? '<div class="pd-card-tags">' + arr(c.tags).map(function(t){ return '<span class="pd-tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      '</div>';

    html += '<dl class="pd-d-facts">' +
      '<div><dt>분야</dt><dd>' + esc(cat.category) + '</dd></div>' +
      '<div><dt>대표</dt><dd>' + esc(c.role || '-') + '</dd></div>' +
      '<div><dt>주요 사업</dt><dd>' + (items.length || '-') + '</dd></div>' +
      '<div><dt>포트폴리오</dt><dd>' + (pf.length || '-') + '</dd></div>' +
      '</dl>';

    html += '<nav class="pd-d-nav" aria-label="상세 목차">' +
      '<a href="#pdD-biz">사업 소개</a><a href="#pdD-str">강점</a><a href="#pdD-int">관심 분야</a><a href="#pdD-pf">포트폴리오' + (pf.length ? ' ' + pf.length : '') + '</a></nav>';

    html += sec('01', 'biz', 'BUSINESS', '어떤 사업을 하나요',
      '<p class="pd-d-text">' + (biz.summary ? nl(biz.summary) : esc(c.desc || '사업 소개를 준비 중입니다.')) + '</p>' +
      (items.length ? '<ol class="pd-d-items">' + items.map(function(t, i){ return '<li><span>' + String(i+1).padStart(2,'0') + '</span>' + esc(t) + '</li>'; }).join('') + '</ol>' : ''));

    html += sec('02', 'str', 'STRENGTHS', '무엇이 강점인가요',
      strengths.length
        ? '<div class="pd-d-str">' + strengths.map(function(s, i){
            var t = typeof s === 'string' ? s : s.title, d = typeof s === 'string' ? '' : s.desc;
            return '<div class="pd-d-str-item"><small>' + String(i+1).padStart(2,'0') + '</small><strong>' + esc(t) + '</strong>' + (d ? '<p>' + esc(d) + '</p>' : '') + '</div>';
          }).join('') + '</div>'
        : '<p class="pd-d-empty">강점 정보를 준비 중입니다.</p>');

    html += sec('03', 'int', 'INTERESTS', '무엇에 관심이 많나요',
      (ints.length ? '<div class="pd-d-int">' + ints.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' : '<p class="pd-d-empty">관심 분야를 준비 중입니다.</p>') +
      (c.lookingFor ? '<figure class="pd-d-want"><figcaption>이런 사업과 연결되고 싶어요</figcaption><blockquote>' + nl(c.lookingFor) + '</blockquote></figure>' : ''));

    html += sec('04', 'pf', 'PORTFOLIO', '포트폴리오',
      pf.length
        ? '<div class="pd-d-pf">' + pf.map(function(p){
            var link = normalizeCompanyLink(p.link);
            var meta = [p.year, p.type].filter(Boolean).map(esc).join('<i></i>');
            return '<div class="pd-d-pf-item"' + (link ? ' data-link="' + esc(link) + '" role="link" tabindex="0"' : '') + '>' +
              '<div class="pd-d-pf-thumb">' + thumb(p.image, p.title, acc, p.year || c.logo) + '</div>' +
              (meta ? '<div class="pd-d-pf-meta">' + meta + '</div>' : '') +
              '<div class="pd-d-pf-title">' + esc(p.title) + '</div>' +
              (p.desc ? '<p class="pd-d-pf-desc">' + esc(p.desc) + '</p>' : '') +
              '</div>';
          }).join('') + '</div>'
        : '<p class="pd-d-empty">포트폴리오를 준비 중입니다.</p>');

    dBody.innerHTML = html;
    dBody.scrollTop = 0;

    var site = normalizeCompanyLink(getCompanyLink(c));
    var connect = CONNECT_URL + (CONNECT_URL.indexOf('?') >= 0 ? '&' : '?') + 'partner=' + encodeURIComponent(c.name);
    dCta.innerHTML =
      (site ? '<a class="pd-d-btn" href="' + esc(site) + '" target="_blank" rel="noopener noreferrer">홈페이지 방문</a>' : '') +
      '<a class="pd-d-btn primary" href="' + esc(connect) + '">이 업체와 연결 문의하기<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>';

    currentId = id;
    if(!detail.classList.contains('open')){
      lastFocus = document.activeElement;
      detail.classList.add('open');
      detail.setAttribute('aria-hidden','false');
      document.documentElement.style.overflow = 'hidden';
    }
    if(!keepFocus){ var cl = document.getElementById('pdDetailClose'); if(cl) cl.focus({preventScroll:true}); }
    try{ history.replaceState(null, '', '#partner=' + encodeURIComponent(id)); }catch(err){}
  }

  function closeDetail(){
    if(!detail.classList.contains('open')) return;
    detail.classList.remove('open');
    detail.setAttribute('aria-hidden','true');
    document.documentElement.style.overflow = '';
    currentId = null;
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(err){}
    if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
  }

  function moveDetail(step){
    var e = INDEX[currentId]; if(!e) return;
    var list = arr(e.cat.companies), n = list.length; if(n < 2) return;
    openDetail(list[(e.idx + step + n) % n].id, true);
  }

  function openFromHash(){
    var m = location.hash.match(/^#partner=(.+)$/);
    if(m){ try{ openDetail(decodeURIComponent(m[1])); }catch(err){} }
  }

  detail.addEventListener('click', function(e){
    if(e.target.closest('[data-close]')) { closeDetail(); return; }
    var mv = e.target.closest('[data-move]');
    if(mv){ moveDetail(parseInt(mv.getAttribute('data-move'), 10)); return; }
    var a = e.target.closest('.pd-d-nav a');
    if(a){
      e.preventDefault();
      var t = dBody.querySelector(a.getAttribute('href'));
      if(t) dBody.scrollTo({ top: t.offsetTop - 50, behavior:'smooth' });
      return;
    }
    var pf = e.target.closest('.pd-d-pf-item[data-link]');
    if(pf) window.open(pf.getAttribute('data-link'), '_blank', 'noopener,noreferrer');
  });

  document.addEventListener('keydown', function(e){
    if(!detail.classList.contains('open')) return;
    if(e.key === 'Escape') closeDetail();
    else if(e.key === 'ArrowLeft' && !/input|textarea/i.test(e.target.tagName)) moveDetail(-1);
    else if(e.key === 'ArrowRight' && !/input|textarea/i.test(e.target.tagName)) moveDetail(1);
  });

  /* 카드 · 리스트 클릭 → 상세 열기 */
  content.addEventListener('click', function(e){
    var t = e.target.closest('.pd-card[data-id], .pd-list-item[data-id]');
    if(t) openDetail(t.getAttribute('data-id'));
  });
  content.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target.closest('.pd-card[data-id], .pd-list-item[data-id]');
    if(!t) return;
    e.preventDefault();
    openDetail(t.getAttribute('data-id'));
  });

  /* ═══════════ 카테고리 탭 드래그 스크롤 ═══════════ */
  (function(){
    var el = navTabs, isDown = false, startX = 0, scrollLeft = 0, hasMoved = false;
    el.addEventListener('mousedown', function(e){
      isDown = true; hasMoved = false; el.classList.add('dragging');
      startX = e.pageX - el.offsetLeft; scrollLeft = el.scrollLeft; e.preventDefault();
    });
    el.addEventListener('mouseleave', function(){ isDown = false; el.classList.remove('dragging'); });
    el.addEventListener('mouseup', function(){ isDown = false; el.classList.remove('dragging'); });
    el.addEventListener('mousemove', function(e){
      if(!isDown) return;
      var walk = (e.pageX - el.offsetLeft - startX) * 1.5;
      if(Math.abs(walk) > 4) hasMoved = true;
      el.scrollLeft = scrollLeft - walk;
    });
    el.addEventListener('click', function(e){
      if(hasMoved){ e.stopPropagation(); e.preventDefault(); hasMoved = false; }
    }, true);
  })();

  /* 탭 클릭 */
  var isClickScrolling = false;
  navTabs.addEventListener('click', function(e){
    var tab = e.target.closest('.pd-nav-tab'); if(!tab) return;
    var target = document.getElementById(tab.getAttribute('data-target')); if(!target) return;
    allTabs.forEach(function(n){ n.setAttribute('data-active','false'); });
    tab.setAttribute('data-active','true');
    isClickScrolling = true;
    target.scrollIntoView({ behavior:'smooth' });
    setTimeout(function(){ isClickScrolling = false; }, 800);
  });

  /* 스크롤 → 활성 탭 */
  var ticking = false, currentActive = -1;
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      pdNav.classList.toggle('scrolled', window.scrollY > 10);
      if(!isClickScrolling && catBlocks.length){
        var navH = pdNav.offsetHeight, newActive = 0;
        for(var i = 0; i < catBlocks.length; i++){
          if(catBlocks[i].getAttribute('data-hidden') !== 'true' && catBlocks[i].getBoundingClientRect().top <= navH + 60) newActive = i;
        }
        if(newActive !== currentActive && allTabs[newActive]){
          currentActive = newActive;
          allTabs.forEach(function(n, j){ n.setAttribute('data-active', j === currentActive ? 'true' : 'false'); });
          var at = allTabs[currentActive], L = at.offsetLeft, W = at.offsetWidth, S = navTabs.scrollLeft, V = navTabs.clientWidth;
          if(L < S) navTabs.scrollTo({ left:L - 16, behavior:'smooth' });
          else if(L + W > S + V) navTabs.scrollTo({ left:L + W - V + 16, behavior:'smooth' });
        }
      }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive:true });

  /* 뷰 토글 */
  var viewBtns = root.querySelectorAll('.pd-view-btn');
  viewBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      var mode = btn.getAttribute('data-view');
      root.setAttribute('data-view', mode);
      viewBtns.forEach(function(b){ b.setAttribute('data-active', b.getAttribute('data-view') === mode ? 'true' : 'false'); });
    });
  });

  /* 카드 슬라이더 화살표 */
  content.addEventListener('click', function(e){
    var btn = e.target.closest('.pd-arrow'); if(!btn) return;
    var slider = document.getElementById(btn.getAttribute('data-slider')); if(!slider) return;
    var card = slider.querySelector('.pd-card');
    var amt = card ? card.offsetWidth + 24 : 400;
    slider.scrollBy({ left: btn.getAttribute('data-dir') === 'prev' ? -amt : amt, behavior:'smooth' });
  });

  /* 카드 슬라이더 드래그 */
  function bindSliderDrag(sl){
    var isDown = false, startX = 0, startLeft = 0, moved = false, preventClick = false, pointerId = null;
    sl.addEventListener('dragstart', function(e){ e.preventDefault(); });
    sl.addEventListener('pointerdown', function(e){
      if(e.pointerType !== 'mouse') return;            // 터치는 기본 스크롤 사용
      if(e.button !== 0) return;
      isDown = true; moved = false; pointerId = e.pointerId;
      startX = e.clientX; startLeft = sl.scrollLeft;
    });
    sl.addEventListener('pointermove', function(e){
      if(!isDown) return;
      var dx = e.clientX - startX;
      if(!moved && Math.abs(dx) > 4){
        moved = true;
        sl.classList.add('dragging');
        try{ sl.setPointerCapture(pointerId); }catch(err){}
      }
      if(moved){ e.preventDefault(); sl.scrollLeft = startLeft - dx * 1.15; }
    });
    function endDrag(){
      if(!isDown) return;
      isDown = false;
      sl.classList.remove('dragging');
      if(moved){ preventClick = true; setTimeout(function(){ preventClick = false; }, 120); }
      try{ if(pointerId !== null) sl.releasePointerCapture(pointerId); }catch(err){}
      pointerId = null;
    }
    sl.addEventListener('pointerup', endDrag);
    sl.addEventListener('pointercancel', endDrag);
    sl.addEventListener('pointerleave', endDrag);
    sl.addEventListener('click', function(e){
      if(preventClick){ e.preventDefault(); e.stopPropagation(); preventClick = false; }
    }, true);
  }

  /* ═══════════ SEARCH ═══════════ */
  var searchInput = document.getElementById('pdSearchInput');
  var searchClear = document.getElementById('pdSearchClear');
  var searchCount = document.getElementById('pdSearchCount');
  var emptyState = document.getElementById('pdEmptyState');
  var emptyKeyword = document.getElementById('pdEmptyKeyword');
  var emptyTips = document.getElementById('pdEmptyTips');

  function buildTips(){
    var seen = {}, out = [];
    DATA.forEach(function(cat){
      if(out.length < 6 && !seen[cat.category]){ seen[cat.category] = 1; out.push(cat.category); }
      arr(cat.companies).forEach(function(c){
        var t = arr(c.tags)[0];
        if(t && out.length < 8 && !seen[t]){ seen[t] = 1; out.push(t); }
      });
    });
    emptyTips.innerHTML = out.map(function(t){ return '<span class="pd-empty-tip" data-q="' + esc(t) + '">' + esc(t) + '</span>'; }).join('');
  }

  function doSearch(){
    var raw = searchInput.value.trim(), q = raw.toLowerCase();
    searchClear.classList.toggle('visible', q.length > 0);
    var total = 0;
    catBlocks.forEach(function(secEl){
      var hit = 0;
      secEl.querySelectorAll('.pd-card').forEach(function(c){
        var m = !q || c.getAttribute('data-q').indexOf(q) !== -1;
        c.setAttribute('data-hidden', m ? 'false' : 'true');
        if(m) hit++;
      });
      secEl.querySelectorAll('.pd-list-item').forEach(function(l){
        l.setAttribute('data-hidden', (!q || l.getAttribute('data-q').indexOf(q) !== -1) ? 'false' : 'true');
      });
      total += hit;
      secEl.setAttribute('data-hidden', q && hit === 0 ? 'true' : 'false');
    });
    if(q){
      searchCount.textContent = '"' + raw + '" 검색 결과 ' + total + '개';
      emptyKeyword.textContent = raw;
      emptyState.classList.toggle('visible', total === 0);
    } else {
      searchCount.textContent = '';
      emptyState.classList.remove('visible');
    }
  }

  searchInput.addEventListener('input', function(){ searchClear.classList.toggle('visible', searchInput.value.trim().length > 0); });
  searchInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); doSearch(); } });
  document.getElementById('pdSearchSubmit').addEventListener('click', doSearch);
  searchClear.addEventListener('click', function(){ searchInput.value = ''; doSearch(); searchInput.focus(); });
  emptyTips.addEventListener('click', function(e){
    var tip = e.target.closest('.pd-empty-tip'); if(!tip) return;
    searchInput.value = tip.getAttribute('data-q');
    doSearch();
  });

  /* ═══════════ 시작 ═══════════ */
  window.BNL_renderPartners = function(data){ render(data); doSearch(); };
  /* data-source="supabase" 이면 샘플 없이 비워두고 biznovalab-dynamic.js 가 실제 데이터를 넣습니다. */
  render(window.BNL_PARTNERS || (root.getAttribute('data-source') === 'supabase' ? [] : SAMPLE));
})();
</script>
</section>
