<script>
(function(){
  const section = document.querySelector("#nhnHeroSlider");
  const slider = section.querySelector(".nhn-slider");
  const slides = section.querySelectorAll(".nhn-slide");
  const bar = section.querySelector(".nhn-progress-bar");
  const page = section.querySelector(".nhn-page");
  const btns = section.querySelectorAll(".nhn-btn");

  let index = 0;
  let timer = null;
  let rafId = null;

  function restartProgress(){
    bar.style.transition = "none";
    bar.style.width = "0%";

    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      rafId = requestAnimationFrame(() => {
        bar.style.transition = "width 4s linear";
        bar.style.width = "100%";
      });
    });
  }

  function update(){
    slider.style.transform = "translateX(-" + (index * 100) + "%)";
    slides.forEach(s => s.classList.remove("active"));
    slides[index].classList.add("active");

    page.textContent =
      String(index + 1).padStart(2, "0") + " / " +
      String(slides.length).padStart(2, "0");

    restartProgress();
  }

  function next(){
    index = (index + 1) % slides.length;
    update();
  }

  function prev(){
    index = (index - 1 + slides.length) % slides.length;
    update();
  }

  function auto(){
    clearInterval(timer);
    timer = setInterval(next, 4000);
  }

  btns.forEach(btn => {
    btn.addEventListener("click", () => {
      if(btn.dataset.dir === "next") next();
      else prev();
      auto();
    });
  });

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        update();
        auto();
      }else{
        clearInterval(timer);
      }
    });
  }, { threshold: 0.5 });

  io.observe(section);
})();
</script>

  /* ═══════════ TAB DRAG ═══════════ */
  (function(){
    var el = navTabs;
    var dragging = false, moved = false;
    var startX = 0, scrollStart = 0;
    var trackX = [], trackT = [];
    var velX = 0, rafId = 0;

    function momentum(){
      velX *= 0.94;
      if(Math.abs(velX) < 0.5) return;
      el.scrollLeft += velX;
      rafId = requestAnimationFrame(momentum);
    }

    el.addEventListener('mousedown', function(e){
      cancelAnimationFrame(rafId);
      dragging = true; moved = false; velX = 0;
      startX = e.clientX;
      scrollStart = el.scrollLeft;
      trackX = [e.clientX]; trackT = [Date.now()];
      el.classList.add('dragging');
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e){
      if(!dragging) return;
      var dx = e.clientX - startX;
      if(Math.abs(dx) > 3) moved = true;
      el.scrollLeft = scrollStart - dx;
      trackX.push(e.clientX); trackT.push(Date.now());
      if(trackX.length > 5){ trackX.shift(); trackT.shift(); }
    });

    document.addEventListener('mouseup', function(){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if(trackX.length >= 2){
        var dt = trackT[trackT.length-1] - trackT[0];
        var dp = trackX[trackX.length-1] - trackX[0];
        if(dt > 0) velX = -dp / dt * 16;
      }
      if(Math.abs(velX) > 0.5) rafId = requestAnimationFrame(momentum);
    });

    el.addEventListener('click', function(e){
      if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
  })();

  /* ═══════════ SCROLL / TAB ═══════════ */
  var allTabs = root.querySelectorAll('.sm-nav-tab');
  var catBlocks = root.querySelectorAll('.sm-cat');
  var smNav = document.getElementById('smNav');
  var ticking=false,currentActive=-1,isClick=false;

  function onScroll(){
    if(ticking)return;ticking=true;
    requestAnimationFrame(function(){
      smNav.classList.toggle('scrolled',window.scrollY>10);
      if(!isClick){
        var navH=smNav.offsetHeight,na=0;
        for(var i=0;i<catBlocks.length;i++){if(catBlocks[i].getAttribute('data-hidden')!=='true'&&catBlocks[i].getBoundingClientRect().top<=navH+80)na=i}
        if(na!==currentActive){
          currentActive=na;
          allTabs.forEach(function(n,j){n.setAttribute('data-active',j===currentActive?'true':'false')});
          var at=allTabs[currentActive],te=navTabs,tl=at.offsetLeft,tw=at.offsetWidth,sL=te.scrollLeft,vW=te.clientWidth;
          if(tl<sL)te.scrollTo({left:tl-16,behavior:'smooth'});
          else if(tl+tw>sL+vW)te.scrollTo({left:tl+tw-vW+16,behavior:'smooth'});
        }
      }
      ticking=false;
    });
  }
  window.addEventListener('scroll',onScroll,{passive:true});

  allTabs.forEach(function(tab){

      tab.setAttribute('data-active','true');
      isClick=true;t.scrollIntoView({behavior:'smooth'});

  /* slider drag */
  root.querySelectorAll('.sm-slider').forEach(function(s){
    var dragging = false;
    var startX = 0, scrollStart = 0;
    var trackX = [], trackT = [];
    var velX = 0, rafId = 0;
    var gap = 20; /* matches CSS gap */

    function getCardWidth(){
      var card = s.querySelector('.sm-card:not([data-hidden="true"])');
      return card ? card.offsetWidth + gap : 340;
    }

    function snapToNearest(){
      var cw = getCardWidth();
      var current = s.scrollLeft;
      var target = Math.round(current / cw) * cw;
      var diff = target - current;
      var step = diff * 0.15;

      function snapTick(){
        var remaining = target - s.scrollLeft;
        if(Math.abs(remaining) < 1){
          s.scrollLeft = target;
          return;
        }
        s.scrollLeft += remaining * 0.18;
        rafId = requestAnimationFrame(snapTick);
      }
      rafId = requestAnimationFrame(snapTick);
    }

    function momentum(){
      velX *= 0.94;
      if(Math.abs(velX) < 1.5){
        snapToNearest();
        return;
      }
      s.scrollLeft += velX;
      rafId = requestAnimationFrame(momentum);
    }

    s.addEventListener('mousedown', function(e){
      cancelAnimationFrame(rafId);
      dragging = true; velX = 0;
      startX = e.clientX;
      scrollStart = s.scrollLeft;
      trackX = [e.clientX]; trackT = [Date.now()];
      s.style.cursor = 'grabbing';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e){
      if(!dragging) return;
      s.scrollLeft = scrollStart - (e.clientX - startX);
      trackX.push(e.clientX); trackT.push(Date.now());
      if(trackX.length > 5){ trackX.shift(); trackT.shift(); }
    });

    document.addEventListener('mouseup', function(){
      if(!dragging) return;
      dragging = false;
      s.style.cursor = '';
      if(trackX.length >= 2){
        var dt = trackT[trackT.length-1] - trackT[0];
        var dp = trackX[trackX.length-1] - trackX[0];
        if(dt > 0) velX = -dp / dt * 16;
      }
      if(Math.abs(velX) > 1.5){
        rafId = requestAnimationFrame(momentum);
      } else {
        snapToNearest();
      }
    });
  });

  /* ═══════════ SUB CATEGORY FILTER ═══════════ */
  root.querySelectorAll('.sm-sub-list').forEach(function(list){
    list.addEventListener('click',function(e){
      var btn=e.target.closest('.sm-sub-btn');
      if(!btn)return;
      list.querySelectorAll('.sm-sub-btn').forEach(function(b){b.setAttribute('data-active','false')});
      btn.setAttribute('data-active','true');
      var sub=btn.getAttribute('data-sub');
      var sec=list.closest('.sm-cat');
      var cards=sec.querySelectorAll('.sm-card');
      var listItems=sec.querySelectorAll('.sm-list-item');
      var count=0;
      cards.forEach(function(c){
        var show=sub==='전체'||c.getAttribute('data-sub')===sub;
        c.setAttribute('data-hidden',show?'false':'true');
        if(show)count++;
      });
      listItems.forEach(function(l){
        var show=sub==='전체'||l.getAttribute('data-sub')===sub;
        l.setAttribute('data-hidden',show?'false':'true');
      });
      var nr=sec.querySelector('.sm-no-result');
      if(nr){count===0?nr.classList.add('visible'):nr.classList.remove('visible')}
    });
  });

  /* ═══════════ SEARCH ═══════════ */
  var searchInput=document.getElementById('smSearchInput');
  var searchClear=document.getElementById('smSearchClear');
  var searchCount=document.getElementById('smSearchCount');

  function doSearch(){
    var q=searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle('visible',q.length>0);
    var totalMatch=0;

    catBlocks.forEach(function(sec){
      var cards=sec.querySelectorAll('.sm-card');
      var listItems=sec.querySelectorAll('.sm-list-item');
      var catMatch=0;

      if(q.length>0){
        sec.querySelectorAll('.sm-sub-btn').forEach(function(b,i){b.setAttribute('data-active',i===0?'true':'false')});
      }

      cards.forEach(function(c){
        if(q.length===0){c.setAttribute('data-hidden','false');catMatch++;return}
        var n=c.getAttribute('data-name'),t=c.getAttribute('data-tags');
        var match=n.indexOf(q)!==-1||t.indexOf(q)!==-1;
        c.setAttribute('data-hidden',match?'false':'true');
        if(match)catMatch++;
      });
      listItems.forEach(function(l){
        if(q.length===0){l.setAttribute('data-hidden','false');return}
        var n=l.getAttribute('data-name'),t=l.getAttribute('data-tags');
        var match=n.indexOf(q)!==-1||t.indexOf(q)!==-1;
        l.setAttribute('data-hidden',match?'false':'true');
      });

      totalMatch+=catMatch;
      sec.setAttribute('data-hidden',catMatch===0&&q.length>0?'true':'false');
      var nr=sec.querySelector('.sm-no-result');
      if(nr){catMatch===0&&q.length>0?nr.classList.add('visible'):nr.classList.remove('visible')}
    });

    if(q.length>0){
      searchCount.textContent='"'+searchInput.value.trim()+'" 검색 결과 '+totalMatch+'개';
    } else {
      searchCount.textContent='';
    }
  }

  searchInput.addEventListener('input',doSearch);
  searchClear.addEventListener('click',function(){searchInput.value='';doSearch();searchInput.focus()});

  requestAnimationFrame(onScroll);
})();
</script>
</section>
